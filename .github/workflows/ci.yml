name: UI Automation Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - staging
          - production

env:
  PYTHON_VERSION: '3.12'
  TEST_ENV: ${{ github.event.inputs.environment || 'test' }}
  HEADLESS: 'true'
  RECORD_VIDEO: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update apt packages
        run: sudo apt-get update

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run tests
        run: pytest tests/ -v --alluredir=allure-results
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'http://121.43.36.83:7081' }}
          TEST_ENV: ${{ env.TEST_ENV }}
          HEADLESS: ${{ env.HEADLESS }}
          RECORD_VIDEO: ${{ env.RECORD_VIDEO }}
        continue-on-error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Check if allure-results exists
        id: check-results
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java
        if: steps.check-results.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure
        if: steps.check-results.outputs.exists == 'true'
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          echo "$PWD/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Get Allure history
        if: steps.check-results.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Prepare Allure history
        if: steps.check-results.outputs.exists == 'true'
        run: |
          mkdir -p allure-history
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history allure-history
          fi

      - name: Generate Allure Report
        if: steps.check-results.outputs.exists == 'true'
        run: |
          if [ -d "allure-history" ]; then
            allure generate allure-results --clean -o allure-report --history allure-history
          else
            allure generate allure-results --clean -o allure-report
          fi

      - name: Upload Allure Report
        if: always() && steps.check-results.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.check-results.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: false